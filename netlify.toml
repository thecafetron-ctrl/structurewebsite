[build]
  command = "echo static site - no build step"
  publish = "."

# Site was migrated from Next.js to a plain static site, but the Netlify
# dashboard still has @netlify/plugin-nextjs enabled. This tells that plugin
# to skip itself so it stops aborting the build on `publish = "."`.
# The clean fix is to uninstall the Next.js plugin in the Netlify UI.
[build.environment]
  NETLIFY_NEXT_PLUGIN_SKIP = "true"
